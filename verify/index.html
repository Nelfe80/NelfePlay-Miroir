    d_seal_none:"지문이 아직 블록체인에 앵커되지 않음. 서명은 이미 검증 가능; Bitcoin 앵커링은 이후.",
    how_t:"결과 읽는 법",
    how1:"인덱스는 완전하고 서명된 기록 목록입니다. 그 SHA-256 지문을 원시 데이터에서 <b>여기서 재계산</b>합니다.",
    how2:"<b>ECDSA P-256 서명</b>을 발행자 공개키로 검증 - 위조는 만들 수 없습니다.",
    how3:"지문을 <b>블록체인에 타임스탬프</b>(OpenTimestamps): 확인되면 불변으로 선후를 증명. <code>.ots</code> 증명은 다운로드 가능하며 표준 OpenTimestamps 클라이언트로 검증할 수 있습니다.",
    dlots:"⬇ .ots 증명 다운로드",
    f_index_lbl:"인덱스 접근 불가",f_index_sub:"기록 인덱스를 가져올 수 없습니다.",
    f_empty_lbl:"빈 인덱스",f_empty_sub:"아직 검증할 기록이 없습니다."}
};
let LANG='en';
const T=k=>(I[LANG]||I.en)[k] ?? (I.en[k]||k);

// Résultats mémorisés (calculés une fois) pour re-rendre au changement de langue.
let R=null;

function paint(){
  document.documentElement.lang=LANG;
  document.querySelector('.logo .tag').textContent=T('tag');
  $('h1').textContent=T('h1');
  $('lede').innerHTML=T('lede');
  $('ct_root').textContent=T('ct_root'); $('ct_sig').textContent=T('ct_sig'); $('ct_seal').textContent=T('ct_seal');
  $('how_t').textContent=T('how_t'); $('how1').innerHTML=T('how1'); $('how2').innerHTML=T('how2'); $('how3').innerHTML=T('how3');
  $('wiki').textContent='📖 '+T('wiki'); $('dlots').textContent=T('dlots');
  if(!R){ $('vlbl').textContent=T('run_lbl'); $('vsub').textContent=T('run_sub'); return; }
  renderResult();
}

function setCheck(k,state,html){
  const st=document.querySelector(`.st[data-k="${k}"]`);
  st.className='st '+state; st.textContent=state==='ok'?'✓':state==='bad'?'✕':state==='wait'?'!':'·';
  document.querySelector(`.d[data-d="${k}"]`).innerHTML=html;
}

function renderResult(){
  if(R.fail){
    $('verdict').className='verdict bad'; $('vicon').textContent='✕';
    $('vlbl').textContent=T(R.fail+'_lbl'); $('vsub').textContent=T(R.fail+'_sub');
    ['root','sig','seal'].forEach(k=>setCheck(k,'bad','-')); $('meta').innerHTML=''; return;
  }
  $('meta').innerHTML=`<span class="pill">${T('pill_records').replace('%N%',R.count)}</span>`+
    `<span class="pill">${T('pill_issuer')} <b translate="no">${R.issuer.slice(0,12)}…</b></span>`;
  setCheck('root', R.rootOk?'ok':'bad',
    `${T('d_root_pre')} <code translate="no">${R.rootCalc.slice(0,20)}…</code><br>`+(R.rootOk?T('d_root_ok'):T('d_root_bad')));
  setCheck('sig', R.sigOk?'ok':'bad', R.sigOk?T('d_sig_ok'):T('d_sig_bad'));
  if(R.block) setCheck('seal','ok', T('d_seal_ok').replace('%B%',R.block).replace('%G%',R.gen));
  else if(R.gen!=null) setCheck('seal','wait', T('d_seal_wait').replace('%G%',R.gen));
  else setCheck('seal','wait', T('d_seal_none'));

  const v=$('verdict');
  if(R.rootOk&&R.sigOk){
    v.className='verdict ok'; $('vicon').textContent='✓';
    $('vlbl').textContent=R.block?T('ok_sealed_lbl'):T('ok_lbl');
    $('vsub').textContent=R.block?T('ok_sealed_sub'):T('ok_sub');
  } else { v.className='verdict bad'; $('vicon').textContent='✕'; $('vlbl').textContent=T('bad_lbl'); $('vsub').textContent=T('bad_sub'); }
}

// ── crypto ───────────────────────────────────────────────────────────────────
const enc=new TextEncoder();
async function sha256hex(s){const b=await crypto.subtle.digest('SHA-256',enc.encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
const jcs=o=>'{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+JSON.stringify(o[k])).join(',')+'}';
function b64urlToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
function pemToBytes(p){return Uint8Array.from(atob(p.replace(/-----[^-]+-----/g,'').replace(/\s+/g,'')),c=>c.charCodeAt(0));}
function derToP1363(der){let i=0;if(der[i++]!==0x30)throw'DER';if(der[i]&0x80)i+=1+(der[i]&0x7f);else i++;
  const rd=(()=>{if(der[i++]!==0x02)throw'DER';let l=der[i++];let v=der.slice(i,i+l);i+=l;return v;})();
  const sd=(()=>{if(der[i++]!==0x02)throw'DER';let l=der[i++];let v=der.slice(i,i+l);i+=l;return v;})();
  const fix=v=>{v=v[0]===0?v.slice(1):v;const o=new Uint8Array(32);o.set(v,32-v.length);return o;};
  const out=new Uint8Array(64);out.set(fix(rd),0);out.set(fix(sd),32);return out;}

async function run(){
  let idx;
  try{ idx=await (await fetch(BASE+'/api/v1/scores/index',{cache:'no-store'})).json(); }
  catch(e){ R={fail:'f_index'}; renderResult(); return; }
  if(!idx||!idx.records){ R={fail:'f_empty'}; renderResult(); return; }

  const rootCalc=await sha256hex(idx.records.map(jcs).join('\n'));
  const rootOk=rootCalc===idx.root;
  let sigOk=false;
  try{
    const key=await crypto.subtle.importKey('spki',pemToBytes(idx.issuer_public_key),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    sigOk=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,derToP1363(b64urlToBytes(idx.signature)),enc.encode(idx.root));
  }catch(e){ sigOk=false; }
  let anchor=null;
  try{ const a=(await (await fetch(BASE+'/api/v1/scores/anchors',{cache:'no-store'})).json()).anchors||[]; anchor=a.find(x=>x.root_sha256===idx.root); }catch(e){}

  R={count:idx.count,issuer:idx.issuer_key_id||'',rootCalc,rootOk,sigOk,
     gen:anchor?anchor.generation:null,block:anchor?anchor.bitcoin_block:null};
  renderResult();
  if(anchor) showOts(anchor.generation);
}

function showOts(gen){
  const a=$('dlots'); a.style.display='inline-flex'; a.href='#';
  a.onclick=async(e)=>{e.preventDefault();
    const d=await (await fetch(BASE+'/api/v1/scores/anchor-proof?generation='+gen)).json();
    if(!d.ots_b64)return;
    const bytes=b64urlToBytes(d.ots_b64.replace(/\+/g,'-').replace(/\//g,'_'));
    const u=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));
    const t=document.createElement('a');t.href=u;t.download=`records-index-gen${gen}.ots`;t.click();URL.revokeObjectURL(u);};
}

function setLang(l,btn){LANG=l;document.querySelectorAll('.langs button').forEach(b=>b.removeAttribute('aria-current'));if(btn)btn.setAttribute('aria-current','true');location.hash=l;paint();}
LANG=(location.hash||'#en').replace('#','')||'en';if(!I[LANG])LANG='en';
const cur=[...document.querySelectorAll('.langs button')].find(x=>x.getAttribute('onclick').includes("'"+LANG+"'"));
if(cur)cur.setAttribute('aria-current','true');
paint();
run();
</script>
</body></html>
